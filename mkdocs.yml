site_name: Mergebot Documentation
site_description: AI-powered code review and merge automation for GitLab
site_author: The Mergebot Team
repo_url: https://github.com/thehapyone/Mergebot
site_url: https://thehapyone.github.io/Mergebot/
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - content.action.view
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.integrate
  palette:
    - scheme: default
      primary: blue
      accent: indigo
    - scheme: slate
      primary: blue
      accent: indigo
  icon:
    repo: fontawesome/brands/github
markdown_extensions:
  - admonition
  - codehilite
  - footnotes
  - meta
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.tasklist
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.magiclink
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.progressbar
  - pymdownx.arithmatex
  - pymdownx.betterem
  - pymdownx.smartsymbols
  - pymdownx.critic
  - pymdownx.escapeall
  - pymdownx.striphtml
  - pymdownx.extra
  - pymdownx.tasklist
  - pymdownx.saneheaders
plugins:
  - search
  - mermaid2
  - git-revision-date-localized:
      fallback_to_build_date: true
  - autorefs
  - awesome-pages
nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Installation: installation.md
  - Usage:
      - Overview: usage/overview.md
      - CLI Reference: usage/cli_reference.md
      - Onboarding: usage/onboarding.md
  - Configuration:
      - Overview: configuration/config_overview.md
      - Approval Policy: configuration/approval_policy.md
      - Config Schema: configuration/config_schema.md
  - Architecture:
      - Overview: architecture/overview.md
      - Flow Engine: architecture/flow.md
      - Dashboard: architecture/dashboard.md
      - Ondemand Runner: architecture/ondemand_runner.md
      - Crews:
          - Code Analysis: architecture/crews/code_analysis.md
          - Complexity: architecture/crews/complexity.md
          - Test: architecture/crews/test.md
          - Risk: architecture/crews/risk.md
          - Impact Evaluator: architecture/crews/impact_eval.md
          - Publication: architecture/crews/publication.md
  - Operations:
      - Docker: operations/docker.md
      - Docker Compose: operations/docker_compose.md
  - Capabilities: capabilities.md
  - Roadmap: roadmap.md
  - Contributing: contributing.md
  - FAQ: faq.md
repo_name: thehapyone/Mergebot
edit_uri: edit/master/docs/
