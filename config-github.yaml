llm:
  model: "azure/gpt-4.1-mini"

repository:
  type: "github"

  github:
    base_branch: "main"

  projects:
    - path: "thehapyone/Sage"
      webhook:
        secret: "replace-with-your-github-webhook-secret"
      overrides:
        merge:
          enabled: true
          threshold: 1.0

crews:
  ImpactEvaluator:
    llm:
      model: "azure/gpt-4.1"

approval_policy:
  threshold: 3.0
  weights:
    CodeAnalysis: 0.4
    ComplexityAnalysis: 0.2
    TestAnalysis: 0.2
    RiskAnalysis: 0.2

merge:
  enabled: true
  threshold: 3.0
  strategy: repo_default
  rules:
    ci_passed: true
    ci_strict: false
    no_changes_requested: true
    mergeable: true
    approval_state: true
    branch_prefixes:
      - "feature/"
      - "renovate/"
      - "dependabot/"

analysis:
  max_mrs: 10 # 0 or missing means unlimited
  draft_mrs: false # If true, analyze Draft/WIP MRs. If false (default), skip Draft/WIP MRs.

telemetry:
  enabled: false # Disable all OpenTelemetry (including CrewAI) by default. Set to true to enable.
