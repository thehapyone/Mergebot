llm:
  model: "azure/gpt-4.1"

repository:
  type: "gitlab"

  gitlab:
    url: "https://gitlab.its.getingecloud.net"
    base_branch: "main"

crews:
  # CodeAnalysis:
  #   llm:
  #     model: "azure/o3-mini"
  # ImpactEvaluator:
  #   llm:
  #     model: "azure/o3-mini"
  TestAnalysis:
    llm:
      model: "azure/gpt-4.1-mini"

approval_policy:
  threshold: 3.0
  weights:
    CodeAnalysis: 0.4
    ComplexityAnalysis: 0.2
    TestAnalysis: 0.2
    RiskAnalysis: 0.2

analysis:
  max_mrs: 10  # 0 or missing means unlimited
  draft_mrs: false  # If true, analyze Draft/WIP MRs. If false (default), skip Draft/WIP MRs.
