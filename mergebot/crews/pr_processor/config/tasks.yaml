pr_retriever_task:
  description: >
    Retrieve pull request (PR) details using the VCS API. User Input: {input}
  agent: pr_retriever
  expected_output: >
    Obtain complete pull request details, including metadata (e.g., title, author, status), pipeline, and diffs.
    Ensure the full PR pipeline/changes/diffs are included. Ensure the PR information is complete and accurate. No hallucination or examples are allowed.
