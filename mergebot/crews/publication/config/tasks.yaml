reporting_task:
  description: |
    Post the provided impact assessment report as a formatted markdown comment on the specified pull or merge request.

    ------------------------------

    **Inputs**:
    - **PR/MR ID**: {pr_id}
    - **Impact Assessment Report**: {impact_assessment_report}

  agent: reporter
  expected_output: |
    After posting, return:
    - The direct URL to the posted comment (as received from the tool).
    - A single-paragraph summary of the assessment report.

    If posting fails, a clear error message is returned.

finalization_task:
  description: |
    Based on the recommendation, make the final decision and communicate the outcome for the given PR/MR.

    **Instructions**:
    1. If the recommendation is to "Auto-approve and merge":
       - Approve and merge the pull or merge request.
    2. If the recommendation is "Requires human review":
       - Leave the PR/MR open for manual review.

    In all cases, post a comment on the PR/MR summarizing the final outcome:
    - Indicate whether the action (approval/merge or leaving open) succeeded or failed.
    - Include any warnings or error messages encountered.

    **Inputs**:
    - **PR ID**: {pr_id}
    - **Recommendation**: {recommendation}

  agent: finalizer
  expected_output: |
    - A confirmation comment is always posted on the PR/MR, summarizing the outcome of the action (success, failure, and any warnings or errors).
    - If auto-approved and merged, state clearly whether the operation succeeded or failed, including any errors (such as authorization failures).
    - If not auto-approved, clearly state that further review is required and include any relevant warnings or errors.
