mr_input_task:
  description: >
    Validate the provided MR input and extract identifiers. User Input: {input}
  agent: mr_input_handler
  expected_output: >
    A structured object containing:
      - mr_id: The ID of the merge request.
      - project_name: The name of the project associated with the MR.

mr_retriever_task:
  description: Retrieve MR details using the GitLab API.
  agent: mr_retriever
  expected_output: >
    Obtain complete MR details, including metadata (e.g., title, author, status) and diffs.
    Ensure the full MR changes/diffs are included
