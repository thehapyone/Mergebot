risk_analysis_task:
  description: |
    Analyze the pull request (PR) changes to identify any potential risks introduced. Consider factors such as:

    - **Modifications to Critical Files or Configurations**: Changes to core modules, system configurations, or foundational code.
    - **Security Vulnerabilities**: Introduction of code that may expose the system to security threats, such as injection vulnerabilities, improper authentication mechanisms, or insecure data handling.
    - **Performance Impacts**: Changes that could degrade system performance, including inefficient algorithms or resource-intensive operations.
    - **Compatibility Issues**: Modifications that might cause integration problems with existing systems, APIs, or dependencies.
    - **Stability and Reliability**: Potential for crashes, data corruption, or other stability issues.

    Evaluate the severity of these risks and provide recommendations for mitigation.

    **Pull Request Details**:
    {pr_details}

  agent: risk_analysis
  expected_output: |
    A structured reviewer verdict with:

    - score: a risk impact score between 0 and 10, where higher scores indicate higher levels of risk.
    - confidence: "low", "medium", or "high" — how confident you are in this assessment given the available context.
    - summary: the identified risks and the reasoning behind the score, explaining why each significant risk matters.
    - findings: one entry per identified risk, evidence-backed. For each finding provide a title;
      a severity of "info", "low", "medium", "high", or "critical"; the affected file path exactly
      as it appears in the PR details or repository context (omit it for repo-wide observations);
      the line number when known; evidence quoting the relevant code or observed fact — required
      for severity medium and above, never speculation; and an actionable recommendation to
      mitigate or address the risk.
    - explored: a short audit trail of what you examined and why.
