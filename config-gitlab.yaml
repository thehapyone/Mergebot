llm:
  model: "azure/gpt-4.1-mini"

repository:
  type: "gitlab"

  gitlab:
    base_branch: "main"

  projects:
    - path: "dts/anthea/iac-layers/gitlab-instance-iacs"
    - path: "dts/anthea/iac-layers/secruity-iac"
    - path: "dts/anthea/on-prem-iac"

crews:
  ImpactEvaluator:
    llm:
      model: "azure/gpt-4.1"

approval_policy:
  threshold: 3.0
  weights:
    CodeAnalysis: 0.4
    ComplexityAnalysis: 0.2
    TestAnalysis: 0.2
    RiskAnalysis: 0.2

merge:
  enabled: true
  threshold: null
  strategy: repo_default
  rules:
    ci_passed: true
    ci_strict: false
    no_changes_requested: true
    mergeable: true
    approval_state: true
    branch_prefixes:
      - "feature/"
      - "renovate/"
      - "bugfix/"

analysis:
  max_mrs: 10 # 0 or missing means unlimited
  draft_mrs: false # If true, analyze Draft/WIP MRs. If false (default), skip Draft/WIP MRs.

telemetry:
  enabled: false # Disable all OpenTelemetry (including CrewAI) by default. Set to true to enable.
