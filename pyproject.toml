[project]
name = "mergebot"
version = "0.2.0"
description = "A bot for analysis, approving, and merging pull/merge requests"
authors = [
    {name = "Ayo Ayibiowu",email = "charlesayibiowu@hotmail.com"}
]
license = {text = "Apache License 2.0"}
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "crewai (==0.203.0)",
    "crewai-tools (==0.76)",
    "python-gitlab (>=5.6.0,<6.0.0)",
    "pygithub (>=2.6.1,<3.0.0)",
    "fastapi (>=0.119.0,<0.120.0)"
]


[project.scripts]
mergebot = "mergebot.app:cli_entry"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = true

[tool.poetry.group.dev.dependencies]
codespell = "^2.4.1"
ruff = "^0.14.13"
pre-commit = "^4.3.0"
mkdocs-material = "^9.6.21"
mkdocs-mermaid2-plugin = "^1.2.3"
mkdocs-git-revision-date-localized-plugin = "^1.4.7"
mkdocs-autorefs = "^1.4.4"
mkdocs-awesome-pages-plugin = "^2.10.1"

[tool.codespell]
ignore-words-list = "allEdges,astroid,noteable"
skip = "poetry.lock,**/site/*,logs.txt,*.pem,*.log"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.pep8-naming]
# Enforce lowercase for class-level constants that aren't truly constant
classmethod-decorators = ["classmethod"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming (catches non-Pythonic naming)
    "UP",     # pyupgrade (modern Python idioms)
    "B",      # flake8-bugbear (likely bugs)
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific rules
    "PL",     # Pylint
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "PLR0913", # too many arguments
    "PLR2004", # magic value comparison
]
