[project]
name = "mergebot"
version = "0.1.0"
description = "A bot for analysis, approving, and merging pull/merge requests"
authors = [
    {name = "Ayo Ayibiowu",email = "charlesayibiowu@hotmail.com"}
]
license = {text = "Apache License 2.0"}
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "crewai (==0.152)",
    "crewai-tools (==0.59)",
    "python-gitlab (>=5.6.0,<6.0.0)",
    "pygithub (>=2.6.1,<3.0.0)"
]


[project.scripts]
mergebot = "mergebot.app:cli_entry"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = true

[tool.poetry.group.dev.dependencies]
codespell = "^2.4.1"
ruff = "^0.13.1"
mkdocs-material = "^9.6.15"
mkdocs-mermaid2-plugin = "^1.2.2"
mkdocs-git-revision-date-localized-plugin = "^1.4.7"
mkdocs-autorefs = "^1.4.3"
mkdocs-awesome-pages-plugin = "^2.10.1"

[tool.codespell]
ignore-words-list = "allEdges,astroid"
skip = "poetry.lock,**/site/*"
